name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python tests (${{ matrix.label }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # `shell: bash` everywhere: Git Bash on Windows, so the step invocations are
    # identical on all three OSes (no PowerShell quoting differences).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # 9 jobs: the full 3.8-3.12 range on Linux, the two endpoints (3.8 + 3.12)
      # on Windows and macOS.
      #
      # macOS 3.8 runs on `macos-15-intel`, not `macos-latest`: macos-latest is
      # Apple Silicon (arm64), and actions/setup-python publishes no arm64 build
      # of Python 3.8, so a 3.8 job there fails at setup. The Intel runner keeps
      # the 3.8 floor tested on macOS; 3.12 runs on the arm64 `macos-latest`, so
      # both CPU architectures are covered. (If GitHub retires macos-15-intel,
      # drop the macOS 3.8 entry rather than raising the floor silently.)
      matrix:
        include:
          - { label: ubuntu,  os: ubuntu-latest,  python-version: "3.8" }
          - { label: ubuntu,  os: ubuntu-latest,  python-version: "3.9" }
          - { label: ubuntu,  os: ubuntu-latest,  python-version: "3.10" }
          - { label: ubuntu,  os: ubuntu-latest,  python-version: "3.11" }
          - { label: ubuntu,  os: ubuntu-latest,  python-version: "3.12" }
          - { label: windows, os: windows-latest, python-version: "3.8" }
          - { label: windows, os: windows-latest, python-version: "3.12" }
          - { label: macos,   os: macos-15-intel, python-version: "3.8" }
          - { label: macos,   os: macos-latest,   python-version: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: plan-gate tests
        run: python plan-gate/tests/test_plan_gate.py
      - name: memory-cap tests
        run: python memory-cap/tests/test_memory_cap.py
      - name: externalized-memory tests
        run: python externalized-memory/tests/test_atomic_write.py
      - name: externalized-memory projection tests
        run: python externalized-memory/tests/test_projection.py
      - name: generated-sink-commit-gate tests
        run: python generated-sink-commit-gate/tests/test_generated_sink_commit_gate.py
      - name: generated-sink-prepush-gate tests
        run: python generated-sink-prepush-gate/tests/test_generated_sink_prepush_gate.py
      - name: scope-lease tests
        run: python scope-lease/tests/test_scope_lease.py
      - name: sink-resolver tests
        run: python sink-resolver/tests/test_sink_resolver.py
      - name: liveness-scan tests
        run: python liveness-scan/tests/test_liveness_scan.py
      - name: test-protection-guard tests
        run: python test-protection-guard/tests/test_test_protection_guard.py

  node:
    name: eslint-plugin tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eslint-plugin-strictlock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: install
        run: npm ci
      - name: eslint-plugin-strictlock tests
        run: npm test

  # Shell tests run on Linux and macOS (BSD sed/grep differences matter for the
  # gate). Not run on Windows: commit-msg-gate is a POSIX bash hook, and Windows
  # users get bash only via Git for Windows, whose coreutils the tests don't
  # target. shellcheck is lint, not a behaviour check, so it stays Linux-only.
  shell:
    name: shell lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck commit-msg-gate/commit-msg-gate.sh
          shellcheck commit-msg-gate/tests/test_commit_msg_gate.sh
      - name: commit-msg-gate tests
        run: bash commit-msg-gate/tests/test_commit_msg_gate.sh

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: scan for secrets, stray UUIDs, and machine paths
        run: |
          set -e
          fail=0
          secrets='(BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36})'
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          if git grep -nIE "$secrets" -- . ':(exclude).github/workflows/ci.yml'; then fail=1; fi
          if git grep -nIE "$uuid" -- . ':(exclude).github/workflows/ci.yml'; then fail=1; fi
          machine='(/Users/[A-Za-z]|[A-Z]:(\\|\\\\)Users)'
          if git grep -nIE "$machine" -- . ':(exclude).github/workflows/ci.yml'; then fail=1; fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Possible secret, stray UUID, or machine path found in tracked files."
            exit 1
          fi
          echo "Secret scan passed."
